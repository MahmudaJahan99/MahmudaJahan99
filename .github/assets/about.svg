     H565
     A20 20 0 0 1 585 175
     V350
     A20 20 0 0 1 565 370
     H60
     Z"
  fill="url(#cardGlass)"
  stroke="#C9B8E8"
  stroke-opacity="0.14"
  filter="url(#shadow)"
/>

<!-- Accent line -->
<rect
  x="60"
  y="155"
  width="5"
  height="215"
