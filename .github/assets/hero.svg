<svg width="1200" height="520" viewBox="0 0 1200 520"
     fill="none" xmlns="http://www.w3.org/2000/svg">
     
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap");
  </style>

  <defs>

    <!-- Background -->
    <linearGradient id="background"
      x1="0" y1="0"
      x2="1200" y2="520"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#100E14"/>
      <stop offset="1" stop-color="#15111C"/>
    </linearGradient>

    <!-- Lavender glow -->
    <radialGradient id="lavenderGlow"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(260 80) rotate(35) scale(360 260)">
      <stop stop-color="#B69ADE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#B69ADE" stop-opacity="0"/>
    </radialGradient>

    <!-- Sage glow -->
    <radialGradient id="sageGlow"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(980 430) rotate(-20) scale(330 240)">
      <stop stop-color="#A9C5A5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A9C5A5" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient id="glass"
      x1="0" y1="0"
      x2="0" y2="520"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.015"/>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow"
      x="-20%" y="-20%"
      width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="25"
        flood-color="#000000"
        flood-opacity="0.35"/>
    </filter>

    <!-- Name gradient -->
    <linearGradient id="nameGradient"
      x1="430" y1="0"
      x2="780" y2="0"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9B8E8"/>
      <stop offset="1" stop-color="#B69ADE"/>
    </linearGradient>

  </defs>


  <!-- Background -->
  <rect width="1200" height="520"
        rx="28"
        fill="url(#background)"/>


  <!-- Ambient glows -->
  <ellipse
    cx="260"
    cy="80"
    rx="260"
    ry="180"
    fill="url(#lavenderGlow)"
    filter="url(#blur)"/>

  <ellipse
    cx="980"
    cy="430"
    rx="250"
    ry="170"
    fill="url(#sageGlow)"
    filter="url(#blur)"/>


  <!-- Glass panel -->
  <rect
    x="24"
    y="24"
    width="1152"
    height="472"
    rx="24"
    fill="url(#glass)"
    stroke="#C9B8E8"
    stroke-opacity="0.13"/>

  <!-- Eyebrow -->
  <text
    x="600"
    y="145"
    text-anchor="middle"
    fill="#A9C5A5"
    font-family="Quicksand, sans-serif"
    font-size="16"
    font-weight="600"
    letter-spacing="4">
    ✦ FRONTEND DEVELOPER
  </text>


  <!-- Name -->
  <text
    x="600"
    y="245"
    text-anchor="middle"
    fill="url(#nameGradient)"
    font-family="Quicksand, sans-serif"
    font-size="72"
    font-weight="600"
    letter-spacing="-1">
    Mahmuda Jahan
  </text>


  <!-- Tagline -->
  <text
    x="600"
    y="285"
    text-anchor="middle"
    fill="#F5F1F7"
    font-family="Quicksand, sans-serif"
    font-size="21"
    font-weight="400">
    Crafting thoughtful digital experiences
  </text>
  

  <!-- Skill pills -->

  <rect
    x="345"
    y="350"
    width="120"
    height="38"
    rx="19"
    fill="#C9B8E8"
    fill-opacity="0.08"
    stroke="#C9B8E8"
    stroke-opacity="0.18"/>

  <text
    x="405"
    y="374"
    text-anchor="middle"
    fill="#C9B8E8"
    font-family="Quicksand, sans-serif"
    font-size="14"
    font-weight="500">
    React
  </text>


  <rect
    x="480"
    y="350"
    width="130"
    height="38"
    rx="19"
    fill="#C9B8E8"
    fill-opacity="0.08"
    stroke="#C9B8E8"
    stroke-opacity="0.18"/>

  <text
    x="545"
    y="374"
    text-anchor="middle"
    fill="#C9B8E8"
    font-family="Quicksand, sans-serif"
    font-size="14"
    font-weight="500">
    Next.js
  </text>


  <rect
    x="625"
    y="350"
    width="140"
    height="38"
    rx="19"
    fill="#C9B8E8"
    fill-opacity="0.08"
    stroke="#C9B8E8"
    stroke-opacity="0.18"/>

  <text
    x="695"
    y="374"
    text-anchor="middle"
    fill="#C9B8E8"
    font-family="Quicksand, sans-serif"
    font-size="14"
    font-weight="500">
    TypeScript
  </text>


  <rect
    x="780"
    y="350"
    width="100"
    height="38"
    rx="19"
    fill="#C9B8E8"
    fill-opacity="0.08"
    stroke="#C9B8E8"
    stroke-opacity="0.18"/>

  <text
    x="830"
    y="374"
    text-anchor="middle"
    fill="#C9B8E8"
    font-family="Quicksand, sans-serif"
    font-size="14"
    font-weight="500">
    UI / UX
  </text>


  <!-- Status -->
  <circle
    cx="485"
    cy="432"
    r="4"
    fill="#A9C5A5"/>

  <text
    x="500"
    y="437"
    fill="#A9C5A5"
    font-family="Quicksand, sans-serif"
    font-size="14">
    Currently building &amp; learning
  </text>

</svg>