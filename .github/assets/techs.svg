<svg width="1200" height="900" viewBox="0 0 1200 900"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap");
  </style>

  <defs>

    <!-- Background -->
    <linearGradient id="background"
      x1="0" y1="0"
      x2="1200" y2="900"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#100E14"/>
      <stop offset="1" stop-color="#15111C"/>
    </linearGradient>

    <!-- Lavender glow -->
    <radialGradient id="lavenderGlow"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(170 150) rotate(25) scale(380 280)">
      <stop stop-color="#B69ADE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B69ADE" stop-opacity="0"/>
    </radialGradient>

    <!-- Sage glow -->
    <radialGradient id="sageGlow"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1050 760) rotate(-25) scale(390 290)">
      <stop stop-color="#A9C5A5" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#A9C5A5" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient id="glass"
      x1="0" y1="0"
      x2="0" y2="900"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <!-- Card glass -->
    <linearGradient id="cardGlass"
      x1="0" y1="0"
      x2="0" y2="230"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow"
      x="-20%" y="-20%"
      width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="22"
        flood-color="#000000"
        flood-opacity="0.30"/>
    </filter>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    width="1200"
    height="900"
    rx="28"
    fill="url(#background)"
  />

  <!-- Ambient glows -->
  <ellipse
    cx="170"
    cy="150"
    rx="300"
    ry="210"
    fill="url(#lavenderGlow)"
    filter="url(#blur)"
  />
  <ellipse
    cx="1050"
    cy="760"
    rx="310"
    ry="220"
    fill="url(#sageGlow)"
    filter="url(#blur)"
  />


  <!-- ========================================================= -->
