        width="25"
        height="25"
        rx="5"
        fill="#C9B8E8"
        fill-opacity="0.12"
    />
    <text
        x="210.5"
        y="190"
        text-anchor="middle"
        fill="#C9B8E8"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700">
