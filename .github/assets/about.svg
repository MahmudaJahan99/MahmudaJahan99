  font-family="Quicksand, sans-serif"
  font-size="15"
  font-weight="400">

  <tspan x="92" dy="0">
    I'm Mahmuda Jahan, a Front-End Developer
  </tspan>

  <tspan x="92" dy="25">
    who enjoys turning ideas and designs into
  </tspan>

  <tspan x="92" dy="25">
    thoughtful, responsive web experiences.
  </tspan>

  <tspan x="92" dy="25">
    I care about clean architecture, accessibility,
  </tspan>

  <tspan x="92" dy="25">
    and interfaces that feel as good as they function.
  </tspan>

</text>


