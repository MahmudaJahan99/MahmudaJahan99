<svg width="1200" height="700" viewBox="0 0 1200 700"
     fill="none" xmlns="http://www.w3.org/2000/svg">

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap");
    </style>

  <defs>

    <!-- Background -->
    <linearGradient id="background"
        x1="0" y1="0"
        x2="1200" y2="700"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#100E14"/>
        <stop offset="1" stop-color="#15111C"/>
    </linearGradient>

    <!-- Lavender glow -->
    <radialGradient id="lavenderGlow"
        cx="0" cy="0" r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(180 90) rotate(25) scale(330 250)">
        <stop stop-color="#B69ADE" stop-opacity="0.20"/>
        <stop offset="1" stop-color="#B69ADE" stop-opacity="0"/>
    </radialGradient>

    <!-- Sage glow -->
    <radialGradient id="sageGlow"
        cx="0" cy="0" r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(1030 610) rotate(-25) scale(350 260)">
        <stop stop-color="#A9C5A5" stop-opacity="0.17"/>
        <stop offset="1" stop-color="#A9C5A5" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient id="glass"
        x1="0" y1="0"
        x2="0" y2="700"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFFFFF" stop-opacity="0.045"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <!-- Card glass -->
    <linearGradient id="cardGlass"
        x1="0" y1="0"
        x2="0" y2="300"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFFFFF" stop-opacity="0.038"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur">
        <feGaussianBlur stdDeviation="28"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow"
        x="-20%" y="-20%"
        width="140%" height="140%">
        <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="24"
        flood-color="#000000"
        flood-opacity="0.32"/>
    </filter>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    width="1200"
    height="700"
    rx="28"
    fill="url(#background)"
  />

  <!-- Ambient glows -->
  <ellipse
    cx="180"
    cy="90"
    rx="270"
    ry="190"
    fill="url(#lavenderGlow)"
    filter="url(#blur)"
  />
  <ellipse
    cx="1030"
    cy="610"
    rx="280"
    ry="200"
    fill="url(#sageGlow)"
    filter="url(#blur)"
  />


<!-- ========================================================= -->
<!-- MAIN GLASS PANEL -->
<!-- ========================================================= -->

<rect
  x="24"
  y="24"
  width="1152"
  height="652"
  rx="24"
  fill="url(#glass)"
  stroke="#C9B8E8"
  stroke-opacity="0.13"
/>


<!-- ========================================================= -->
<!-- SECTION HEADER -->
<!-- ========================================================= -->

<text
  x="600"
  y="82"
  text-anchor="middle"
  fill="#A9C5A5"
  font-family="Quicksand, sans-serif"
  font-size="14"
  font-weight="600"
  letter-spacing="4">
  ✦ ABOUT ME
</text>

<text
  x="600"
  y="118"
  text-anchor="middle"
  fill="#F5F1F7"
  font-family="Quicksand, sans-serif"
  font-size="21"
  font-weight="500">
  A little about the person behind the interfaces
</text>


