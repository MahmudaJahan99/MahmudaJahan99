<svg width="1200" height="290" viewBox="0 0 1200 290"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap");
  </style>

  <defs>

    <!-- Background -->
    <linearGradient id="background"
        x1="0" y1="0"
        x2="1200" y2="290"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#100E14"/>
        <stop offset="1" stop-color="#15111C"/>
    </linearGradient>

    <!-- Lavender glow -->
    <radialGradient id="lavenderGlow"
        cx="0" cy="0" r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(300 70) rotate(20) scale(300 150)">
        <stop stop-color="#B69ADE" stop-opacity="0.18"/>
        <stop offset="1" stop-color="#B69ADE" stop-opacity="0"/>
    </radialGradient>

    <!-- Sage glow -->
    <radialGradient id="sageGlow"
        cx="0" cy="0" r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(930 200) rotate(-20) scale(300 150)">
        <stop stop-color="#A9C5A5" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#A9C5A5" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient id="glass"
        x1="0" y1="0"
        x2="0" y2="290"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFFFFF" stop-opacity="0.045"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card"
        x1="0" y1="0"
        x2="0" y2="58"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#FFFFFF" stop-opacity="0.04"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.012"/>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur">
        <feGaussianBlur stdDeviation="25"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow"
        x="-20%" y="-20%"
        width="140%" height="140%">
        <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.30"/>
    </filter>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    width="1200"
    height="290"
    rx="28"
    fill="url(#background)"
  />


  <!-- Ambient glows -->
  <ellipse
    cx="160"
    cy="120"
    rx="300"
    ry="210"
    fill="url(#lavenderGlow)"
    filter="url(#blur)"
  />
  <ellipse
    cx="1040"
    cy="200"
    rx="310"
    ry="220"
    fill="url(#sageGlow)"
    filter="url(#blur)"
  />


  <!-- ========================================================= -->
  <!-- MAIN GLASS PANEL -->
  <!-- ========================================================= -->

  <rect
    x="24"
    y="24"
    width="1152"
    height="242"
    rx="24"
    fill="url(#glass)"
    stroke="#C9B8E8"
    stroke-opacity="0.13"
  />


  <!-- ========================================================= -->
  <!-- SECTION HEADER -->
  <!-- ========================================================= -->

  <text
    x="600"
    y="82"
    text-anchor="middle"
    fill="#A9C5A5"
    font-family="Quicksand, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="4">
    ✦ LET'S CONNECT
  </text>

  <text
    x="600"
    y="118"
    text-anchor="middle"
    fill="#F5F1F7"
    font-family="Quicksand, sans-serif"
    font-size="21"
    font-weight="500">
    Find me around the web
  </text>


    <!-- ========================================================= -->
